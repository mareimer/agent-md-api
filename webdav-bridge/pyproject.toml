[project]
name = "webdav-bridge"
version = "0.1.0"
description = "WebDAV bridge for the Agent API — humans access files via Explorer/Finder (spec.md §14). Generic, no domain-data coupling."
requires-python = ">=3.11"
dependencies = [
    "wsgidav>=4.3",
    "cheroot>=10.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT[crypto]>=2.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "GitPython>=3.1",
    "uvicorn>=0.30",
]

[project.scripts]
webdav-bridge-cli = "webdav_bridge.cli:main"
# Tests also import `agent_md_api` directly to run the Agent-API core in-process
# alongside the bridge. Install the sibling package too before running tests:
#   pip install -e ".[dev]" -e ..

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
